<html lang="en">
  <head>

    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

    <header>
      <div class="logo">
        <a href=""> <span>G</span>Travel </a>
      </div>
      <nav>
        <ul class="nav-items">
          <li class="nav-links"><a href="">Menu</a></li>
          <li class="nav-links"><a href="">Travel Guides</a></li>
          <li class="nav-links"><a href="">Plans</a></li>
          <li class="nav-links"><a href="">About Us</a></li>

              <li>#Honeymoon</li>
